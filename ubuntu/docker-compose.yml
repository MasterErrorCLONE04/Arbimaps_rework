services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arbitriumsas-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Exclude local venv from container to avoid conflicts
      - /app/venv
    env_file:
      - .env
    # Fallback environment variables if .env is missing or doesn't have them
    environment:
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Arbitrium2026*}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
    restart: always

