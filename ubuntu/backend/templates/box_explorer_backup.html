<div class="card">

  <h2 style="margin-bottom:10px;">Explorador Box </h2>

  <p class="sub" style="margin-bottom:10px;">
    Navega por la carpeta raíz configurada (BOX_ROOT_FOLDER_ID).
  </p>

  <!-- BARRA SUPERIOR -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">

    <div style="display:flex; gap:10px; align-items:center;">

      <label style="background:#f5f7fa; padding:6px 12px; border-radius:6px; border:1px solid #ddd; cursor:pointer;">
        📄 Seleccionar archivo
        <input type="file" id="fileUpload" style="display:none;">
      </label>

      <button class="btn btn-success" id="btnUpload">⬆ Subir</button>
      <button class="btn btn-secondary" id="btnBack">⬅ Atrás</button>
      <button class="btn btn-primary" id="btnNewFolder">📁 Nueva carpeta</button>
      <button class="btn btn-warning" id="btnSync">🔄 Sincronizar</button>
      <button class="btn btn-info" id="btnCarpeteo">📁 Crear Carpeteo</button>

      <div id="syncContainer" style="margin-top:10px; display:none;">

        <div style="font-size:13px; margin-bottom:4px;">
          <span id="syncText">Iniciando...</span>
        </div>

        <div style="width:100%; background:#eee; border-radius:6px; overflow:hidden;">
          <div id="syncBar" style="width:0%; height:20px; background:#28a745;"></div>
        </div>

      </div>

    </div>

    <span class="hint" id="crumb">Ruta: (root)</span>

  </div>

  <!-- CONTENIDO -->
  <div style="display:flex; gap:16px; height:650px;">

    <!-- LISTA -->
    <div style="width:40%; border-right:1px solid #eee; padding-right:10px; overflow:auto;">

      <p id="status">Cargando...</p>

      <table class="table" id="tbl" style="display:none;">
        <thead>
          <tr>
            <th></th>
            <th>Nombre</th>
            <th>ID</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

    </div>

    <!-- VISOR -->
    <div style="width:60%; padding-left:10px;">

      <div style="font-weight:700; margin-bottom:6px;">Vista previa</div>

      <div style="border:1px solid #ddd; border-radius:10px; overflow:hidden; height:600px;">
        <iframe id="viewer" style="width:100%; height:100%; border:none;"></iframe>
      </div>

    </div>

  </div>

</div>


<style>
  #tbody tr:hover {
    background: #f5f7fa;
    cursor: pointer;
  }
</style>


<script>

  const apiBase = "/api";

  let stack = [];
  let currentFolderId = "";

  const elStatus = document.getElementById("status");
  const elTbl = document.getElementById("tbl");
  const elBody = document.getElementById("tbody");
  const elCrumb = document.getElementById("crumb");

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(txt);
    }
    return await res.json();
  }

  async function load(folderId = "") {

    currentFolderId = folderId;

    elStatus.textContent = "Cargando...";
    elTbl.style.display = "none";
    elBody.innerHTML = "";

    const url = folderId
      ? `${apiBase}/box/list?folder_id=${encodeURIComponent(folderId)}`
      : `${apiBase}/box/list`;

    try {

      const data = await fetchJson(url);

      elCrumb.textContent = `Ruta: ${data.folder}`;

      const items = data.items || [];

      if (!items.length) {
        elStatus.textContent = "Carpeta vacía.";
        return;
      }

      elStatus.textContent = `Items: ${items.length}`;
      elTbl.style.display = "";

      for (const it of items) {

        const tr = document.createElement("tr");

        tr.onclick = async () => {
          if (it.type === "folder") {
            stack.push(currentFolderId);
            load(it.id);
          } else {
            const openData = await fetchJson(
              `${apiBase}/box/open?item_type=file&item_id=${it.id}`
            );
            document.getElementById("viewer").src = openData.preview_url;
          }
        };

        const tdIcon = document.createElement("td");
        tdIcon.innerHTML = it.type === "folder" ? "📁" : "📄";

        const tdName = document.createElement("td");
        tdName.innerHTML = `<b>${it.name}</b>`;

        const tdId = document.createElement("td");
        tdId.textContent = it.id;

        const tdAct = document.createElement("td");

        if (it.type === "folder") {
          const btn = document.createElement("button");
          btn.className = "btn btn-sm btn-primary";
          btn.textContent = "Entrar";

          btn.onclick = (e) => {
            e.stopPropagation();
            stack.push(currentFolderId);
            load(it.id);
          };

          tdAct.appendChild(btn);

        } else {
          const btn = document.createElement("button");
          btn.className = "btn btn-sm btn-success";
          btn.textContent = "Ver";

          btn.onclick = async (e) => {
            e.stopPropagation();
            const openData = await fetchJson(
              `${apiBase}/box/open?item_type=file&item_id=${it.id}`
            );
            document.getElementById("viewer").src = openData.preview_url;
          };

          tdAct.appendChild(btn);
        }

        const btnRename = document.createElement("button");
        btnRename.className = "btn btn-sm btn-warning";
        btnRename.textContent = "✏️";

        btnRename.onclick = async (e) => {
          e.stopPropagation();

          const newName = prompt("Nuevo nombre:", it.name);
          if (!newName || !newName.trim()) return;

          const formData = new FormData();
          formData.append("item_type", it.type);
          formData.append("item_id", it.id);
          formData.append("new_name", newName);

          const res = await fetch(`${apiBase}/box/rename`, {
            method: "POST",
            body: formData
          });

          if (!res.ok) {
            alert(await res.text());
            return;
          }

          alert("Renombrado");
          load(currentFolderId);
        };

        tdAct.appendChild(btnRename);

        tr.appendChild(tdIcon);
        tr.appendChild(tdName);
        tr.appendChild(tdId);
        tr.appendChild(tdAct);

        elBody.appendChild(tr);
      }

    } catch (e) {
      elStatus.textContent = "Error: " + e.message;
    }
  }

  // =========================
  // BOTONES BASE
  // =========================

  document.getElementById("btnBack").onclick = () => {
    const prev = stack.pop();
    load(prev || "");
  };

  document.getElementById("btnUpload").onclick = async () => {
    const file = document.getElementById("fileUpload").files[0];
    if (!file) return alert("Seleccione archivo");

    const fd = new FormData();
    fd.append("file", file);
    fd.append("folder_id", currentFolderId);

    const res = await fetch(`${apiBase}/box/upload`, {
      method: "POST",
      body: fd
    });

    if (!res.ok) return alert(await res.text());

    alert("Subido");
    load(currentFolderId);
  };

  document.getElementById("btnNewFolder").onclick = async () => {
    const name = prompt("Nombre carpeta:");
    if (!name) return;

    const fd = new FormData();
    fd.append("name", name);
    fd.append("parent_id", currentFolderId);

    const res = await fetch(`${apiBase}/box/mkdir`, {
      method: "POST",
      body: fd
    });

    if (!res.ok) return alert(await res.text());

    load(currentFolderId);
  };

  // =========================
  // PROCESOS (SYNC + CARPETEO)
  // =========================

  let syncInterval = null;

  function startProgress(text) {
    document.getElementById("syncContainer").style.display = "block";
    document.getElementById("syncBar").style.width = "0%";
    document.getElementById("syncText").textContent = text;
  }

  function startPolling() {
    if (syncInterval) clearInterval(syncInterval);
    syncInterval = setInterval(updateSyncStatus, 2000);
  }

  // 🔄 SYNC
  document.getElementById("btnSync").onclick = async () => {
    startProgress("Iniciando sincronización...");
    await fetch(`${apiBase}/sync-projects`, { method: "POST" });
    startPolling();
  };

  // 📁 CARPETEO
  document.getElementById("btnCarpeteo").onclick = async () => {

    currentFolderId = "";  // 🔥 RESET

    startProgress("Iniciando carpeteo...");

    await fetch(`${apiBase}/create-carpeteo`, { method: "POST" });

    startPolling();
  };

  // 📊 STATUS
  async function updateSyncStatus() {
    try {
      const res = await fetch(`${apiBase}/sync-status`);
      const data = await res.json();

      if (data.status === "idle") return;

      const percent = data.total > 0
        ? Math.round((data.current / data.total) * 100)
        : 0;

      document.getElementById("syncBar").style.width = percent + "%";

      document.getElementById("syncText").textContent =
        `${data.project || "Procesando..."} (${data.current}/${data.total}) - ${percent}%`;

      if (data.status === "done") {
        clearInterval(syncInterval);
        document.getElementById("syncText").textContent = "✅ Proceso completado";
        load(currentFolderId);
      }

      if (data.status === "error") {
        clearInterval(syncInterval);
        document.getElementById("syncText").textContent =
          "❌ Error: " + data.project;
      }

    } catch (e) {
      console.error("Error:", e);
    }
  }

  // INIT
  load();

</script>
