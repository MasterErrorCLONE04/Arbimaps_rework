<!-- Modal Historial de la Asignación -->
<div class="modal fade modal-right" id="modalHistorial" tabindex="-1" aria-labelledby="modalHistorialLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content sync-modal-content">
      <!-- Modal Header -->
      <div class="modal-header sync-modal-header border-0 p-4 align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <div class="sync-modal-icon-circle d-flex align-items-center justify-content-center">
            <i class="fa-solid fa-clock-rotate-left text-white"></i>
          </div>
          <div>
            <h5 class="sync-modal-title fw-bold" id="modalHistorialLabel">Historial de la asignación</h5>
            <small class="sync-modal-subtitle d-block">Consulta la información más relevante de los cambios que ha tenido esta asignación</small>
          </div>
        </div>
        <button type="button" class="btn p-0 border-0 shadow-none sync-modal-close d-flex align-items-center justify-content-center" data-bs-dismiss="modal" aria-label="Cerrar" style="background: transparent; color: #032F57;">
          <i class="bi bi-x-lg fs-5"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body sync-modal-body p-4">
        <div class="asigDetailTableWrap asig-table-history">
          <div class="table-responsive">
            <table id="tablaHistorial" class="asigDetailTable asigDetailTable-history table mb-0 w-100">
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Evento</th>
                  <th>Descripción</th>
                </tr>
              </thead>
              <tbody id="asigDetalleEventosBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
