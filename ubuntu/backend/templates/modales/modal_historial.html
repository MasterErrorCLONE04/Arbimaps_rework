<style>
  .modal-header-historial {
    background-color: #0A2C1B;
    color: white;
  }

  .btn-cerrar-historial {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background-color: #C4D5CC;
    color: #0A2C1B;
    transition: transform .25s ease, box-shadow .25s ease;
  }

  .btn-cerrar-historial i {
    transition: transform .25s ease;
  }

  .btn-cerrar-historial:hover {
    transform: scale(1.12);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
  }

  .btn-cerrar-historial:hover i {
    transform: rotate(90deg);
  }

  #tablaHistorial {
    border-collapse: separate;
    border-spacing: 0 10px;
  }

  #tablaHistorial thead th {
    background-color: #E9F0EC;
    color: #0A2C1B;
    border: none;
    padding: 14px 16px;
    font-size: .82rem;
    text-transform: uppercase;
    letter-spacing: .4px;
  }

  #tablaHistorial thead th:first-child {
    border-radius: 10px 0 0 10px;
  }

  #tablaHistorial thead th:last-child {
    border-radius: 0 10px 10px 0;
  }

  #tablaHistorial tbody tr {
    background: #fff;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .07);
    transition: transform .2s ease, box-shadow .2s ease;
  }

  #tablaHistorial tbody tr:hover {
    transform: translateX(6px);
    box-shadow: 0 6px 18px rgba(10, 44, 27, .15);
  }

  #tablaHistorial tbody td {
    border: none;
    padding: 15px 16px;
    vertical-align: middle;
  }

  #tablaHistorial tbody td:first-child {
    position: relative;
    padding-left: 34px;
    font-weight: 600;
    color: #0A2C1B;
    white-space: nowrap;
  }

  #tablaHistorial tbody td:first-child::before {
    content: "";
    position: absolute;
    left: 14px;
    top: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #0A2C1B;
    transform: translateY(-50%);
    box-shadow: 0 0 0 4px rgba(10, 44, 27, .12);
  }

  #tablaHistorial tbody td:first-child::after {
    content: "";
    position: absolute;
    left: 18px;
    top: 0;
    width: 2px;
    height: 100%;
    background: #D5E1DA;
    z-index: 0;
  }

  #tablaHistorial tbody td:first-child::before {
    z-index: 1;
  }

  #tablaHistorial tbody td:nth-child(2) {
    font-weight: 600;
    color: #244335;
  }

  #tablaHistorial tbody td:last-child {
    color: #66736D;
  }

  #tablaHistorial tbody tr td:first-child {
    border-radius: 10px 0 0 10px;
  }

  #tablaHistorial tbody tr td:last-child {
    border-radius: 0 10px 10px 0;
  }
</style>

<!-- Modal Historial de la Asignación -->
<div class="modal fade modal-right" id="modalHistorial" tabindex="-1" aria-labelledby="modalHistorialLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header-historial position-relative p-4">
        <div class="text-center px-5">
          <h4 class="fw-bold" id="modalHistorialLabel">Historial de la asignación</h4>
          <small class="mt-1">Consulta la información más relevante de los cambios que ha tenido esta asignación</small>
        </div>
        <button type="button"
          class="btn-cerrar-historial position-absolute top-0 end-0 mt-5 me-3 d-flex align-items-center justify-content-center"
          data-bs-dismiss="modal" aria-label="Cerrar">
          <i class="bi bi-x-lg fs-5"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table id="tablaHistorial" class="table mb-0">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Evento</th>
                <th>Descripción</th>
              </tr>
            </thead>
            <tbody id="asigDetalleEventosBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
