<style>
  .modal-header-comentarios {
    background-color: #0A2C1B;
    color: white;
  }

  .btn-cerrar-comentarios {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #C4D5CC;
    color: #0A2C1B;
    transition: transform .25s ease, box-shadow .25s ease;
  }

  .btn-cerrar-comentarios i {
    transition: transform .25s ease;
  }

  .btn-cerrar-comentarios:hover {
    transform: scale(1.12);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
  }

  .btn-cerrar-comentarios:hover i {
    transform: rotate(90deg);
  }

  .comentarios-body {
    background: #F7F9F8;
  }

  .comentarios-timeline {
    position: relative;
    padding-left: 18px;
  }

  .comentarios-timeline:before {
    content: "";
    position: absolute;
    left: 20px;
    top: 14px;
    bottom: 14px;
    width: 2px;
    background: #D5E1DA;
  }

  .comentario-item {
    position: relative;
    margin-left: 26px;
    padding: 16px 18px;
    background: #fff;
    border: 1px solid #E1E9E4;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(10, 44, 27, .06);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }

  .comentario-item:hover {
    transform: translateX(5px);
    border-color: #B8CDC1;
    box-shadow: 0 7px 18px rgba(10, 44, 27, .12);
  }

  .comentario-punto {
    position: absolute;
    left: -34px;
    top: 20px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #0A2C1B;
    border: 4px solid #EAF1ED;
    box-shadow: 0 0 0 2px #0A2C1B;
  }

  .comentario-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #E8F0EB;
    color: #0A2C1B;
    font-size: 1.05rem;
  }

  .comentario-usuario {
    color: #0A2C1B;
    font-size: .95rem;
    font-weight: 700;
  }

  .comentario-fecha {
    font-size: .75rem;
    color: #7A8981;
    white-space: nowrap;
  }

  .comentario-texto {
    margin-top: 10px;
    padding: 12px 14px;
    background: #F8FAF9;
    border-left: 3px solid #0A2C1B;
    border-radius: 0 8px 8px 0;
    color: #4C5C54;
    font-size: .88rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .comentario-rol {
    font-size: .68rem;
    font-weight: 600;
    border-radius: 20px;
    padding: 4px 9px;
  }

  .comentario-transicion {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: .75rem;
  }

  .comentario-estado {
    padding: 4px 9px;
    border-radius: 20px;
    background: #EEF3F0;
    border: 1px solid #CCD9D1;
    color: #496056;
    font-weight: 600;
  }

  .comentario-estado-destino {
    background: #0A2C1B;
    color: #fff;
    border-color: #0A2C1B;
  }

  .comentario-enlace {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    background: #EDF4F0;
    color: #0A2C1B;
    text-decoration: none;
    font-size: .8rem;
    transition: background .2s ease, transform .2s ease;
  }

  .comentario-enlace:hover {
    background: #DCEAE2;
    color: #0A2C1B;
    transform: translateX(3px);
  }

  .comentarios-vacio {
    border: 2px dashed #D5E1DA;
    border-radius: 12px;
    background: #FAFCFB;
    color: #77867E;
  }

  .comentarios-vacio i {
    color: #9DB3A7;
  }
</style>

<!-- Modal Comentarios y Recomendaciones -->
<div class="modal fade modal-right" id="modalComentarios" tabindex="-1" aria-labelledby="modalComentariosLabel"

  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header-comentarios position-relative p-4">
        <div class="text-center px-5">
          <h4 class="fw-bold" id="modalComentariosLabel">Comentarios y Recomendaciones</h4>
          <small class="mt-1">Historial de comentarios y recomendaciones de respuesta registrados en el flujo de la
            asignación</small>
        </div>
        <button type="button"
          class="btn-cerrar-comentarios position-absolute top-0 end-0 mt-5 me-3 d-flex align-items-center justify-content-center"

          <i class="bi bi-x-lg fs-5"></i>
        </button>
      </div>
      <div class="modal-body comentarios-body p-4">
        <div id="comentariosList" class="comentarios-timeline d-flex flex-column gap-3"></div>
        <div id="noComentariosMsg" class="comentarios-vacio text-center py-5">
          <i class="bi bi-chat-square-text fs-1 d-block mb-3"></i>
          <h6 class="fw-bold mb-1">Sin comentarios registrados</h6>
          <small>Esta asignación todavía no tiene comentarios, recomendaciones o novedades asociadas a su flujo.</small>
        </div>
      </div>
    </div>
  </div>
</div>
