<script>
    var datosPruebaOpcion4 = [];
    // script para las sub pestañas de la informacion de las personas de la cuarta pestaña
    function crearCampoSoloLectura(label, valor) {
        return `
            <div class="mb-3">
                <label class="form-label-information mb-2">${label}</label>
                <div class="rounded-3 px-2 py-2 w-100 result-information">
                    ${valor || '----'}
                </div>
            </div>
        `;
    }

    function crearCampoCuotaParticipacion(label, valor) {
        return `
        <div class="mb-3">
            <label class="form-label-information mb-2">${label}</label>
            <div class="rounded-3 px-2 py-2 w-100 result-information d-flex justify-content-between align-items-center">
                <span>${valor ?? '----'}</span>
                <span class="fw-bold">%</span>
            </div>
        </div>
    `;
    }

    function formatearFechaInputAVisual(valor) {
        if (!valor) return '----';

        const partes = valor.split('-');
        if (partes.length !== 3) return valor;

        const [anio, mes, dia] = partes;
        return `${dia}/${mes}/${anio}`;
    }

    function crearCampoFechaInicioTendencia(label, valor, idPersona) {
        const valorInput = valor || '';
        const valorVisual = formatearFechaInputAVisual(valorInput);

        return `
            <div class="mb-3">
                <label class="form-label-information mb-2">${label}</label>

                <div
                    class="rounded-3 px-2 py-2 w-100 result-information d-flex justify-content-between align-items-center campo-fecha-tendencia-wrap"
                    id="campo_fecha_inicio_tendencia_${idPersona}">
                    <span id="texto_fecha_inicio_tendencia_${idPersona}">${valorVisual}</span>
                    <div class="position-relative d-flex align-items-center justify-content-center campo-fecha-tendencia-icono-wrap">
                        <button
                            type="button"
                            class="btn btn-sm p-0 border-0 bg-transparent campo-fecha-tendencia-icono-wrap"
                            onclick="abrirCalendarioFechaInicioTendencia(${idPersona})"
                            aria-label="Abrir calendario">
                            <i class="fa-solid fa-calendar-minus campo-fecha-tendencia-icono"></i>
                        </button>
                        <input
                            type="date"
                            class="campo-fecha-tendencia-input"
                            id="fecha_inicio_tendencia_${idPersona}"
                            name="fecha_inicio_tendencia_${idPersona}"
                            value="${valorInput}"
                            onchange="actualizarFechaInicioTendencia(${idPersona}, this.value)"
                            aria-label="${label}"
                        >
                    </div>
                </div>
            </div>
        `;
    }

    function crearCampoCheckDerecho(label, checked, idPersona) {
        return `
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center w-100 py-2 rounded-3 field-check-custom">
                    <span class="text-field-check small">${label}</span>
                    <input
                        class="form-check-input check-custom m-0"
                        type="checkbox"
                        id="posesion_ancestral_tradicional_${idPersona}"
                        name="posesion_ancestral_tradicional_${idPersona}"
                        ${checked ? 'checked' : ''}
                        onchange="actualizarCheckDerecho(${idPersona}, this.checked)"
                    >
                </div>
            </div>
        `;
    }

    // FUNCION PARA LA PARTE DE ADJUNTOS
    function crearBloqueAdjuntoInteresado(adjunto, idPersona) {
        const titulo = adjunto?.titulo || `Adjunto interesado:${idPersona}`;
        const archivo = adjunto?.archivo || '----';
        const observacion = adjunto?.observacion || 'Null';

        const noTieneAdjunto = !adjunto || archivo === '----' || archivo.trim() === '';

        if (noTieneAdjunto) {
            return `
            <div class="col-12">
                <input
                    type="file"
                    id="inputAdjuntoInteresado_${idPersona}"
                    accept=".pdf,.jpg,.jpeg,.png"

                <div class="d-flex justify-content-end mb-2">
                    <button
                        type="button"
                        class="btn btn-sm btn-boton-save-adjunto-for px-3"

                    <div class="bg-white p-3 rounded-3 border content-form-adjunto-unido">
                        <div class="mb-3">
                            <label class="content-text-label mb-2">Archivo</label>
                            <div
                                class="input-form-dropdown input-label-doc rounded-3 px-2 py-2 d-flex align-items-center"
                                id="archivoAdjuntoInteresadoDisplay_${idPersona}"
                                role="button"
                                tabindex="0"
                                onclick="document.getElementById('inputAdjuntoInteresado_${idPersona}').click()">
                                ----
                            </div>
                        </div>

                        <div class="adjunto-observacion-box mt-3">
                            <div class="adjunto-observacion-header">
                                Observación del adjunto
                            </div>
                            <div
                                class="adjunto-observacion-body d-flex align-items-start"
                                id="observacionAdjuntoInteresado_${idPersona}"
                                contenteditable="true"
                                spellcheck="false">Null</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-3">
                            <button
                                type="button"
                                class="btn btn-sm btn-boton-abort px-3 text-white"
                                onclick="cancelarAdjuntoInteresado(${idPersona})">
                                Cancelar
                            </button>

                            <button
                                type="button"
                                class="btn btn-sm btn-boton-save-adjunto px-3"
                                onclick="guardarAdjuntoInteresado(${idPersona})">
                                Guardar adjunto
                                <i class="fa-solid fa-plus ms-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        }

        return `
        <div class="col-12">
            <div class="adjunto-interesado-card rounded-3 overflow-hidden">
                <button
                    class="btn w-100 border-0 shadow-none d-flex justify-content-between align-items-center py-1 adjunto-interesado-toggle"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapseAdjuntoInteresado_${idPersona}"
                    aria-expanded="false"
                    aria-controls="collapseAdjuntoInteresado_${idPersona}">

                        <i class="fa-solid fa-file-pdf adjunto-interesado-icon"></i>
                        <span class="adjunto-interesado-title">${titulo}</span>
                    </div>

                    <i class="fa-solid fa-chevron-down adjunto-interesado-arrow"></i>
                </button>

                <div class="collapse" id="collapseAdjuntoInteresado_${idPersona}">
                    <div class="px-3 pb-3 pt-2">
                        <div class="mb-3">
                            <label class="form-label-archivo mb-2">Archivo</label>
                            <div class="adjunto-interesado-file rounded-3 px-3 py-1 d-flex justify-content-between align-items-center">
                                <span class="text-truncate me-2">${archivo}</span>
                                <i class="fa-solid fa-file-pdf adjunto-interesado-file-icon"></i>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="adjunto-interesado-observacion rounded-3 overflow-hidden">
                                <div class="adjunto-interesado-observacion-header px-3 py-2">

                                </div>
                                <div class="adjunto-interesado-observacion-body px-3 py-4 d-flex align-items-start">
                                    ${observacion}
                                </div>
                            </div>
                        </div>

                                type="button"
                                class="btn adjunto-interesado-btn-eliminar px-3 py-2"
                                onclick="eliminarAdjuntoInteresado(${idPersona})">
                                Eliminar
                                <i class="fa-solid fa-xmark ms-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
    }

    // FUNCION PARA LA CONDICIONAL SEGUN EL TIPO DE PERSONA

    // FUNCION PARA AGREGAR EL ADJUNTO
    function abrirFormularioAdjuntoInteresado(idPersona) {
        const collapse = document.getElementById(`collapseAdjuntoInteresado_${idPersona}`);
        const input = document.getElementById(`inputAdjuntoInteresado_${idPersona}`);
        const display = document.getElementById(`archivoAdjuntoInteresadoDisplay_${idPersona}`);

        if (collapse && window.bootstrap?.Collapse) {
            bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false }).show();
        } else if (collapse) {
            collapse.classList.add('show');
        }

        if (input && !input.dataset.listenerInicializado) {
            input.dataset.listenerInicializado = 'true';

            input.addEventListener('change', function () {
                const archivo = this.files && this.files.length > 0 ? this.files[0] : null;
                if (display) {
                    display.textContent = archivo ? archivo.name : '----';
                }
            });
        }

        if (display && !display.dataset.listenerInicializado) {
            display.dataset.listenerInicializado = 'true';

            display.addEventListener('keydown', function (event) {
