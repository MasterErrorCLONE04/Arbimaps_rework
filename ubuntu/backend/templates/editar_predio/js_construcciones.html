<script>
    // =========================
    // DATOS DE PRUEBA PESTAÑA 5
    // =========================
    var datosPruebaOpcion5 = [];

    let construccionSeleccionadaOpcion5 = null;

    // =========================
    // HELPERS
    // =========================
    function obtenerConstruccionOpcion5(idConstruccion) {
        return datosPruebaOpcion5.find(item => item.idConstruccion === idConstruccion);
    }

    function obtenerUnidadConstruccionOpcion5(idUnidadConstruccion) {
        for (const construccion of datosPruebaOpcion5) {
            const unidad = (construccion.unidadesConstruccion || []).find(
                item => item.idUnidadConstruccion === idUnidadConstruccion
            );

            if (unidad) {
                return { construccion, unidad };
            }
        }
        return null;
    }

    function escaparHtml(valor) {
        return String(valor ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function obtenerTextoNormalizado(elemento) {
        if (!elemento) return '';
        return elemento.textContent.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
    }

    // FUNCION PARA ACTUALIZAR EL CAMPO EDITABLE Y EL PLACEHOLDER
    function actualizarEstadoCampoEditableOpcion5(campo) {
        if (!campo) return;

        const texto = obtenerTextoNormalizado(campo);
        const placeholderVacio = campo.dataset.placeholderVacio || '----';
        const vacio = !texto || texto === placeholderVacio || texto === '----' || texto === 'Null';

        campo.classList.toggle('result-information-editable-empty', vacio);
        campo.classList.toggle('result-information-geo-editable-empty', vacio);
    }
    // FIN DE ACTUALIZAR EL CAMPO EDITABLE Y EL PLACEHOLDER

    // FUNCION DE LIMPIAR EL PLACEHOLDER
    function limpiarPlaceholderCampoEditableOpcion5(campo) {
        if (!campo) return;

        const texto = obtenerTextoNormalizado(campo);
        const placeholderVacio = campo.dataset.placeholderVacio || '----';

        if (texto === placeholderVacio || texto === '----' || texto === 'Null') {
            campo.textContent = '';
        }
        actualizarEstadoCampoEditableOpcion5(campo);
    }
    // FIN DE LA FUNCION DE LIMPIAR EL PLACEHOLDER

    // FUNCION DE OBTENER EL VALOR DEL CAMPO DE EDITABLE
    function obtenerValorCampoEditableOpcion5(campo) {
        const valor = obtenerTextoNormalizado(campo);
        const placeholderVacio = campo?.dataset?.placeholderVacio || '----';

        return valor === placeholderVacio || valor === '----' || valor === 'Null' ? '' : valor;
    }
    // FIN FUNCION DE OBTENER EL VALOR DEL CAMPO DE EDITABLE


    function actualizarCampoUnidadConstruccionOpcion5(idUnidadConstruccion, ruta, campo) {
        const resultado = obtenerUnidadConstruccionOpcion5(idUnidadConstruccion);
        if (!resultado || !campo) return;

        resultado.unidad[ruta] = obtenerValorCampoEditableOpcion5(campo);
        actualizarEstadoCampoEditableOpcion5(campo);
        prepararPayloadEdicionPredio();
    }

    // CAMPO DE FINALIZAR EL CAMPO DE LAS UNIDADES DE CONSTRUCCION
    function finalizarCampoUnidadConstruccionOpcion5(idUnidadConstruccion, ruta, campo) {
        if (!campo) return;

        const placeholderVacio = campo.dataset.placeholderVacio || '----';
        if (!obtenerValorCampoEditableOpcion5(campo)) {
            campo.textContent = placeholderVacio;
        }
        actualizarCampoUnidadConstruccionOpcion5(idUnidadConstruccion, ruta, campo);
    }
    // FIN PARA EL CAMPO DE FINALIZAR EL CAMPO DE LAS UNIDADES DE CONSTRUCCION

    // =========================
    // TARJETA 1 - CONSTRUCCIONES
    // =========================
    function crearCampoConstruccionOpcion5(label, valor, idConstruccion, ruta) {
        return `
            <div class="mb-2">
                <label class="form-label-information mb-1">${label}</label>
                <div
                    class="rounded-3 px-2 py-1 w-100 result-information-construccion"
                    contenteditable="true"
                    spellcheck="false"
                    role="textbox"
                    tabindex="0"
                    onfocus="limpiarPlaceholderCampoEditableOpcion5(this)"
                    oninput="actualizarCampoConstruccionOpcion5(${idConstruccion}, '${ruta}', this)"
                    onblur="finalizarCampoConstruccionOpcion5(${idConstruccion}, '${ruta}', this)">
                    ${escaparHtml(valor || '----')}
                </div>
            </div>
        `;
    }

    function actualizarCampoConstruccionOpcion5(idConstruccion, ruta, campo) {
        const construccion = obtenerConstruccionOpcion5(idConstruccion);
        if (!construccion || !campo) return;

        construccion[ruta] = obtenerValorCampoEditableOpcion5(campo);
        actualizarEstadoCampoEditableOpcion5(campo);
        prepararPayloadEdicionPredio();
    }

    function finalizarCampoConstruccionOpcion5(idConstruccion, ruta, campo) {
        if (!campo) return;

        if (!obtenerValorCampoEditableOpcion5(campo)) {
            campo.textContent = '----';
        }

        actualizarCampoConstruccionOpcion5(idConstruccion, ruta, campo);
    }

    function crearFormularioAdjuntoConstruccionOpcion5(construccion) {
        return `
            <div class="bg-white p-3 rounded-3 border content-form-adjunto-unido mt-2">
                <input
                    type="file"
                    id="inputAdjuntoConstruccion_${construccion.idConstruccion}"
                    accept=".pdf,.jpg,.jpeg,.png"
                    class="d-none"
                >

                <div class="mb-3">
                    <label class="content-text-label mb-2">Archivo</label>
                    <div
                        class="input-form-dropdown input-label-doc rounded-3 px-2 py-2 d-flex align-items-center"
                        id="archivoAdjuntoConstruccionDisplay_${construccion.idConstruccion}"
                        role="button"
                        tabindex="0"
                        onclick="document.getElementById('inputAdjuntoConstruccion_${construccion.idConstruccion}').click()">
                        Seleccionar
                    </div>
                </div>

                <div class="adjunto-observacion-box mt-3">
                    <div class="adjunto-observacion-header">
                        Observación del adjunto
                    </div>
                    <div
                        class="adjunto-observacion-body d-flex align-items-start"
                        id="observacionAdjuntoConstruccion_${construccion.idConstruccion}"
                        contenteditable="true"
                        spellcheck="false">Null</div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button
                        type="button"
                        class="btn btn-sm btn-boton-abort px-3 text-white"
                        onclick="cancelarAdjuntoConstruccion(${construccion.idConstruccion})">
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-sm btn-boton-save-adjunto px-3"
                        onclick="guardarAdjuntoConstruccion(${construccion.idConstruccion})">
                        Guardar adjunto
                        <i class="fa-solid fa-plus ms-2"></i>
                    </button>
                </div>
            </div>
        `;
    }

    function crearBloqueAdjuntoConstruccionOpcion5(construccion) {
        const adjunto = construccion.adjunto;
        const tieneAdjunto = !!adjunto && !!adjunto.titulo;

        if (!tieneAdjunto) {
            return `
                <div class="text-end">
                    <button type="button"
                        class="btn btn-sm btn-boton-save-adjunto-for px-3"
                        onclick="abrirFormularioAdjuntoConstruccion(${construccion.idConstruccion})">
                        Añadir adjunto
                        <i class="fa-solid fa-plus ms-2"></i>
                    </button>
                </div>

                <div class="collapse" id="collapseFormularioAdjuntoConstruccion_${construccion.idConstruccion}">
                    ${crearFormularioAdjuntoConstruccionOpcion5(construccion)}
                </div>
            `;
        }

        return `
            <div class="mb-3">
                <div class="adjunto-construccion-card">
                    <button
                        class="btn w-100 border-0 shadow-none d-flex justify-content-between align-items-center py-1 px-3 adjunto-construccion-toggle"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseAdjuntoConstruccion_${construccion.idConstruccion}"
                        aria-expanded="false"
                        aria-controls="collapseAdjuntoConstruccion_${construccion.idConstruccion}">
                        
                        <div class="d-flex align-items-center gap-2">
                            <i class="fa-solid fa-file-pdf adjunto-construccion-icon"></i>
                            <span class="adjunto-construccion-title">${escaparHtml(adjunto.titulo)}</span>
                        </div>

                        <i class="fa-solid fa-chevron-down adjunto-construccion-arrow"></i>
                    </button>

                    <div class="collapse" id="collapseAdjuntoConstruccion_${construccion.idConstruccion}">
                        <div class="px-3 pb-3 pt-2">
                            <div class="mb-2">
                                <label class="form-label-information mb-2">Archivo</label>
                                <div class="adjunto-construccion-file rounded-3 px-3 py-2">
                                    ${escaparHtml(adjunto.archivo || '----')}
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="adjunto-construccion-observacion rounded-3 overflow-hidden">
                                    <div class="adjunto-construccion-observacion-header px-3 py-2">
                                        Observación del adjunto
                                    </div>
                                    <div class="adjunto-construccion-observacion-body px-3 py-3">
                                        ${escaparHtml(adjunto.observacion || 'Null')}
                                    </div>
                                </div>
                            </div>

                            <div class="text-end">
                                <button type="button"
                                    class="btn adjunto-construccion-btn-eliminar px-3 py-1"
                                    onclick="eliminarAdjuntoConstruccion(${construccion.idConstruccion})">
                                    Eliminar
                                    <i class="fa-solid fa-xmark ms-2"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="collapse mt-2" id="collapseFormularioAdjuntoConstruccion_${construccion.idConstruccion}">
                    ${crearFormularioAdjuntoConstruccionOpcion5(construccion)}
                </div>

                <div class="text-end mt-3">
                    <button type="button"
                        class="btn btn-sm btn-boton-save-adjunto-for px-3"
                        onclick="abrirFormularioAdjuntoConstruccion(${construccion.idConstruccion})">
                        Añadir adjunto
                        <i class="fa-solid fa-plus ms-2"></i>
                    </button>
                </div>
            </div>
        `;
    }

    function renderizarListadoConstruccionesOpcion5(construcciones) {
        const contenedor = document.getElementById('contenedorListadoConstruccionesOpcion5');
        if (!contenedor) return;

        contenedor.innerHTML = '';

        construcciones.forEach((construccion) => {
            contenedor.innerHTML += `
                <div class="construccion-acordeon-item mb-2">
                    <button
                        class="btn w-100 text-start construccion-acordeon-toggle d-flex justify-content-between align-items-center collapsed py-2"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapseConstruccion_${construccion.idConstruccion}"
                        aria-expanded="false"
                        aria-controls="collapseConstruccion_${construccion.idConstruccion}"
                        onclick="seleccionarConstruccionOpcion5(${construccion.idConstruccion})">
                        <span>Etiqueta: ${escaparHtml(construccion.etiqueta)}</span>
                        <i class="fa-solid fa-chevron-down icon-dropdown-arrow"></i>
                    </button>

                    <div class="collapse" id="collapseConstruccion_${construccion.idConstruccion}">
                        <div class="construccion-acordeon-body">
                            <div class="text-end mb-3">
                                <button type="button" class="btn btn-boton-editar-geo">
                                    Editar geometría
                                    <i class="fa-solid fa-pencil ms-2 icon-pencil-edit-geo"></i>
                                </button>
                            </div>
                            
                            ${crearCampoConstruccionOpcion5('Predio asociado', construccion.predioAsociado, construccion.idConstruccion, 'predioAsociado')}
                            ${crearCampoConstruccionOpcion5('Etiqueta', construccion.etiqueta, construccion.idConstruccion, 'etiqueta')}

                            <div class="title-tarjet-information mb-3 mt-2">
                                Adjuntos
                            </div>

                            ${crearBloqueAdjuntoConstruccionOpcion5(construccion)}
                        </div>
                    </div>
                </div>
            `;
        });

        inicializarIconosConstruccionOpcion5();
    }

    function inicializarIconosConstruccionOpcion5() {
        document.querySelectorAll('.construccion-acordeon-item .collapse').forEach((collapseEl) => {
            collapseEl.addEventListener('show.bs.collapse', function () {
                const boton = document.querySelector(`[data-bs-target="#${this.id}"]`);
                const icono = boton?.querySelector('i');

                if (icono) {
                    icono.classList.remove('fa-chevron-down');
                    icono.classList.add('fa-chevron-up');
                }
            });

            collapseEl.addEventListener('hide.bs.collapse', function () {
                const boton = document.querySelector(`[data-bs-target="#${this.id}"]`);
                const icono = boton?.querySelector('i');

                if (icono) {
                    icono.classList.remove('fa-chevron-up');
                    icono.classList.add('fa-chevron-down');
                }
            });

            collapseEl.addEventListener('hidden.bs.collapse', function () {
                if (!this.id.startsWith('collapseConstruccion_')) return;

                const idConstruccion = Number(this.id.replace('collapseConstruccion_', ''));

                if (construccionSeleccionadaOpcion5 === idConstruccion) {
                    construccionSeleccionadaOpcion5 = null;
                    actualizarBadgeConstruccionSeleccionadaOpcion5(null);
                    renderizarEstadoVacioUnidadConstruccionOpcion5('Esta construcción no tiene UC');
                }
            });
        });

        document.querySelectorAll('.adjunto-construccion-card .collapse').forEach((collapseEl) => {
            collapseEl.addEventListener('show.bs.collapse', function () {
                const boton = document.querySelector(`[data-bs-target="#${this.id}"]`);
                const icono = boton?.querySelector('.adjunto-construccion-arrow');

                if (icono) {
                    icono.classList.remove('fa-chevron-down');
                    icono.classList.add('fa-chevron-up');
                }
            });

            collapseEl.addEventListener('hide.bs.collapse', function () {
                const boton = document.querySelector(`[data-bs-target="#${this.id}"]`);
                const icono = boton?.querySelector('.adjunto-construccion-arrow');

                if (icono) {
                    icono.classList.remove('fa-chevron-up');
                    icono.classList.add('fa-chevron-down');
                }
            });
        });
    }

    function abrirFormularioAdjuntoConstruccion(idConstruccion) {
        const collapse = document.getElementById(`collapseFormularioAdjuntoConstruccion_${idConstruccion}`);
        const input = document.getElementById(`inputAdjuntoConstruccion_${idConstruccion}`);
        const display = document.getElementById(`archivoAdjuntoConstruccionDisplay_${idConstruccion}`);

        if (collapse && window.bootstrap?.Collapse) {
            bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false }).show();
        } else if (collapse) {
            collapse.classList.add('show');
        }

        if (input && !input.dataset.listenerInicializado) {
            input.dataset.listenerInicializado = 'true';

            input.addEventListener('change', function () {
                const archivo = this.files && this.files.length > 0 ? this.files[0] : null;
                if (display) {
                    display.textContent = archivo ? archivo.name : 'Seleccionar';
                }
            });
        }

        if (display && !display.dataset.listenerInicializado) {
            display.dataset.listenerInicializado = 'true';

            display.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    input?.click();
                }
            });
        }
    }

    function cancelarAdjuntoConstruccion(idConstruccion) {
        const collapse = document.getElementById(`collapseFormularioAdjuntoConstruccion_${idConstruccion}`);
        const input = document.getElementById(`inputAdjuntoConstruccion_${idConstruccion}`);
        const display = document.getElementById(`archivoAdjuntoConstruccionDisplay_${idConstruccion}`);
        const observacion = document.getElementById(`observacionAdjuntoConstruccion_${idConstruccion}`);

        if (input) input.value = '';
        if (display) display.textContent = 'Seleccionar';
        if (observacion) observacion.textContent = 'Null';

        if (collapse && window.bootstrap?.Collapse) {
            bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false }).hide();
        } else if (collapse) {
            collapse.classList.remove('show');
        }
    }

    function guardarAdjuntoConstruccion(idConstruccion) {
        const construccion = obtenerConstruccionOpcion5(idConstruccion);
        const input = document.getElementById(`inputAdjuntoConstruccion_${idConstruccion}`);
        const observacion = document.getElementById(`observacionAdjuntoConstruccion_${idConstruccion}`);

        if (!construccion || !input) return;

        const archivo = input.files && input.files.length > 0 ? input.files[0] : null;
        const textoObservacion = observacion ? observacion.textContent.trim() : 'Null';

        if (!archivo) return;

        construccion.adjunto = {
            titulo: `Adjunto Construccion:${idConstruccion}`,
            archivo: archivo.name,
            observacion: textoObservacion || 'Null'
        };

        renderizarListadoConstruccionesOpcion5(datosPruebaOpcion5);
        prepararPayloadEdicionPredio();
    }

    function eliminarAdjuntoConstruccion(idConstruccion) {
        const construccion = obtenerConstruccionOpcion5(idConstruccion);
        if (!construccion) return;

        construccion.adjunto = null;

        renderizarListadoConstruccionesOpcion5(datosPruebaOpcion5);
        setTimeout(() => {
            abrirFormularioAdjuntoConstruccion(idConstruccion);
        }, 100);

        prepararPayloadEdicionPredio();
    }

    // =========================
    // TARJETA 2 - UNIDAD DE CONSTRUCCIÓN
    // =========================
    function actualizarBadgeConstruccionSeleccionadaOpcion5(construccion) {
        const badge = document.getElementById('badgeConstruccionSeleccionadaOpcion5');
        const texto = document.getElementById('textoBadgeConstruccionSeleccionadaOpcion5');

        if (!badge || !texto) return;

        if (!construccion) {
            badge.style.display = 'none';
            texto.textContent = '';
            return;
        }

        texto.textContent = `Construcción ${construccion.etiqueta}`;
        badge.style.display = 'inline-flex';
    }

    function seleccionarConstruccionOpcion5(idConstruccion) {
        construccionSeleccionadaOpcion5 = idConstruccion;
        const construccion = obtenerConstruccionOpcion5(idConstruccion);

        actualizarBadgeConstruccionSeleccionadaOpcion5(construccion);
        renderizarListadoUnidadConstruccionOpcion5(idConstruccion);
        prepararPayloadEdicionPredio();
    }

    function crearCampoUnidadConstruccionOpcion5(label, valor, idUnidadConstruccion, ruta) {
        return `
            <div class="mb-2">
                <label class="form-label-information mb-1">${label}</label>
                <div
                    class="rounded-3 px-2 py-1 w-100 result-information-construccion"
                    contenteditable="true"
                    spellcheck="false"
                    role="textbox"
                    tabindex="0"
                    onfocus="limpiarPlaceholderCampoEditableOpcion5(this)"
                    oninput="actualizarCampoUnidadConstruccionOpcion5(${idUnidadConstruccion}, '${ruta}', this)"
                    onblur="finalizarCampoUnidadConstruccionOpcion5(${idUnidadConstruccion}, '${ruta}', this)">
                    ${escaparHtml(valor || '----')}
                </div>
            </div>
        `;
    }

    function crearCampoUnidadConstruccionOpcion5ConSufijo(label, valor, sufijo, idUnidadConstruccion, ruta) {
        return `
            <div class="mb-2">
                <label class="form-label-information mb-1">${label}</label>
                <div class="rounded-3 px-2 py-1 w-100 result-information-construccion d-flex justify-content-between align-items-center">
                    <span
                        class="flex-grow-1"
                        contenteditable="true"
                        spellcheck="false"
                        role="textbox"
                        tabindex="0"
                        onfocus="limpiarPlaceholderCampoEditableOpcion5(this)"
                        oninput="actualizarCampoUnidadConstruccionOpcion5(${idUnidadConstruccion}, '${ruta}', this)"
                        onblur="finalizarCampoUnidadConstruccionOpcion5(${idUnidadConstruccion}, '${ruta}', this)">
                        ${escaparHtml(valor || '----')}
                    </span>
                    <span class="fw-bold ms-2 text-muted">${sufijo}</span>
                </div>
            </div>
        `;
    }

    function crearTextAreaUnidadConstruccionOpcion5(label, valor, idUnidadConstruccion, ruta) {
        return `
            <div class="mb-2">
                <label class="form-label-information mb-1">${label}</label>
                <div
                    class="rounded-3 px-2 py-2 w-100 result-information-construccion d-flex align-items-start"
                    style="min-height: 102px;"
                    contenteditable="true"
                    spellcheck="false"
                    role="textbox"
                    tabindex="0"
                    onfocus="limpiarPlaceholderCampoEditableOpcion5(this)"
                    oninput="actualizarCampoUnidadConstruccionOpcion5(${idUnidadConstruccion}, '${ruta}', this)"
                    onblur="finalizarCampoUnidadConstruccionOpcion5(${idUnidadConstruccion}, '${ruta}', this)">
                    ${escaparHtml(valor || '----')}
                </div>
            </div>
        `;
    }

    function crearSelectTipoPlantaUc(unidad) {
        return `
            <div class="mb-2">
                <label class="form-label-information mb-1">Tipo de planta</label>

                <input
                    type="hidden"
                    name="tipo_planta_uc_${unidad.idUnidadConstruccion}"
                    id="tipo_planta_uc_${unidad.idUnidadConstruccion}"
                    value="${escaparHtml(unidad.tipoPlantaUc || '')}"
                >

                <div class="dropdown w-100">
                    <button
                        class="btn w-100 text-start result-information-construccion d-flex justify-content-between align-items-center"
                        type="button"
                        id="dropdownTipoPlantaUc_${unidad.idUnidadConstruccion}"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <span>${escaparHtml(unidad.tipoPlantaUc || 'Ninguna Selección')}</span>
                        <i class="fa-solid fa-chevron-down icon-dropdown-arrow"></i>
                    </button>

                    <ul class="dropdown-menu w-100 custom-dropdown-menu dropdown-menu-scroll">
                        <li>
                            <button class="dropdown-item" type="button"
                                onclick="seleccionarTipoPlantaUc(${unidad.idUnidadConstruccion}, '', 'Ninguna Selección')">
                                Ninguna selección
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item" type="button"
                                onclick="seleccionarTipoPlantaUc(${unidad.idUnidadConstruccion}, 'Mezanine', 'Mezanine')">
                                Mezanine
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item" type="button"
                                onclick="seleccionarTipoPlantaUc(${unidad.idUnidadConstruccion}, 'Piso', 'Piso')">
                                Piso
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item" type="button"
                                onclick="seleccionarTipoPlantaUc(${unidad.idUnidadConstruccion}, 'Semisótano', 'Semisótano')">
                                Semisótano
                            </button>
                        </li>
                        <li>
                            <button class="dropdown-item" type="button"
                                onclick="seleccionarTipoPlantaUc(${unidad.idUnidadConstruccion}, 'Sótano', 'Sótano')">
                                Sótano
                            </button>

    function obtenerSiguienteIdConstruccionOpcion5() {
        const ids = datosPruebaOpcion5.map(item => Number(item.idConstruccion) || 0);
        return ids.length ? Math.max(...ids) + 1 : 1;
    }

    function obtenerSiguienteIdUnidadConstruccionOpcion5() {
        const ids = datosPruebaOpcion5.flatMap(construccion =>
            (construccion.unidadesConstruccion || []).map(unidad => Number(unidad.idUnidadConstruccion) || 0)
        );

        return ids.length ? Math.max(...ids) + 1 : 101;
    }

    function abrirFormularioAdjuntoUc(idUnidadConstruccion) {
        const collapse = document.getElementById(`collapseFormularioAdjuntoUc_${idUnidadConstruccion}`);
        const input = document.getElementById(`inputAdjuntoUc_${idUnidadConstruccion}`);
        const display = document.getElementById(`archivoAdjuntoUcDisplay_${idUnidadConstruccion}`);

        if (collapse && window.bootstrap?.Collapse) {
            bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false }).show();
        } else if (collapse) {
            collapse.classList.add('show');
        }

        if (input && !input.dataset.listenerInicializado) {
            input.dataset.listenerInicializado = 'true';

            input.addEventListener('change', function () {
                const archivo = this.files && this.files.length > 0 ? this.files[0] : null;
                if (display) {
                    display.textContent = archivo ? archivo.name : 'Seleccionar';
                }
            });
        }

        if (display && !display.dataset.listenerInicializado) {
            display.dataset.listenerInicializado = 'true';

            display.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    input?.click();
                }
            });
        }

        const collapse = document.getElementById(`collapseFormularioAdjuntoUc_${idUnidadConstruccion}`);
        const input = document.getElementById(`inputAdjuntoUc_${idUnidadConstruccion}`);
        const display = document.getElementById(`archivoAdjuntoUcDisplay_${idUnidadConstruccion}`);
        const observacion = document.getElementById(`observacionAdjuntoUc_${idUnidadConstruccion}`);

        if (input) input.value = '';
        if (display) display.textContent = 'Seleccionar';
        if (observacion) observacion.textContent = 'Null';

        if (collapse && window.bootstrap?.Collapse) {
            bootstrap.Collapse.getOrCreateInstance(collapse, { toggle: false }).hide();
        } else if (collapse) {
            collapse.classList.remove('show');
        }
    }

    function guardarAdjuntoUc(idUnidadConstruccion) {
        const resultado = obtenerUnidadConstruccionOpcion5(idUnidadConstruccion);
        const input = document.getElementById(`inputAdjuntoUc_${idUnidadConstruccion}`);
        const observacion = document.getElementById(`observacionAdjuntoUc_${idUnidadConstruccion}`);

        if (!resultado || !input) return;

        const archivo = input.files && input.files.length > 0 ? input.files[0] : null;
        const textoObservacion = observacion ? observacion.textContent.trim() : 'Null';

        if (!archivo) return;

        resultado.unidad.adjunto = {
            titulo: `Adjunto Terreno:${idUnidadConstruccion}`,
            archivo: archivo.name,
            observacion: textoObservacion || 'Null'
        };

        renderizarListadoUnidadConstruccionOpcion5(resultado.construccion.idConstruccion);
        prepararPayloadEdicionPredio();
    }

    function eliminarAdjuntoUc(idUnidadConstruccion) {
        const resultado = obtenerUnidadConstruccionOpcion5(idUnidadConstruccion);
        if (!resultado) return;

        resultado.unidad.adjunto = null;

        renderizarListadoUnidadConstruccionOpcion5(resultado.construccion.idConstruccion);

        setTimeout(() => {
            abrirFormularioAdjuntoUc(idUnidadConstruccion);
        }, 100);

        prepararPayloadEdicionPredio();
    }

    function toggleCaracteristicasUcOpcion5(idUnidadConstruccion) {
        const detalleNormal = document.getElementById(`detalleNormalUc_${idUnidadConstruccion}`);
        const detalleCaracteristicas = document.getElementById(`detalleCaracteristicasUc_${idUnidadConstruccion}`);

        if (!detalleNormal || !detalleCaracteristicas) return;

        detalleNormal.classList.add('uc-panel-saliendo');

        setTimeout(() => {
            detalleNormal.classList.add('d-none');
            detalleNormal.classList.remove('uc-panel-saliendo');

            detalleCaracteristicas.classList.remove('d-none');

            requestAnimationFrame(() => {
                detalleCaracteristicas.classList.add('uc-panel-activo');
            });
        }, 180);
    }

    function cerrarCaracteristicasUcOpcion5(idUnidadConstruccion) {
        const detalleNormal = document.getElementById(`detalleNormalUc_${idUnidadConstruccion}`);
        const detalleCaracteristicas = document.getElementById(`detalleCaracteristicasUc_${idUnidadConstruccion}`);

        if (!detalleNormal || !detalleCaracteristicas) return;

        detalleCaracteristicas.classList.remove('uc-panel-activo');
        detalleCaracteristicas.classList.add('uc-panel-saliendo');

        setTimeout(() => {
            detalleCaracteristicas.classList.add('d-none');
            detalleCaracteristicas.classList.remove('uc-panel-saliendo');

            detalleNormal.classList.remove('d-none');

            requestAnimationFrame(() => {
                detalleNormal.classList.add('uc-panel-activo');
            });

            setTimeout(() => {
                detalleNormal.classList.remove('uc-panel-activo');
            }, 220);
        }, 180);
    }

    function actualizarAlturaSuperiorSeisUc(idUnidadConstruccion, checked) {
        const resultado = obtenerUnidadConstruccionOpcion5(idUnidadConstruccion);
        if (!resultado?.unidad) return;

        resultado.unidad.alturaSuperiorSeisUc = checked;
        prepararPayloadEdicionPredio();
    }

    function actualizarTotalCalificacionCerchasUc(idUnidadConstruccion, campo) {
        const resultado = obtenerUnidadConstruccionOpcion5(idUnidadConstruccion);
        if (!resultado?.unidad || !campo) return;

        resultado.unidad.totalCalificacionCerchasUc = obtenerValorCampoEditableOpcion5(campo);
        prepararPayloadEdicionPredio();
    }

    function finalizarTotalCalificacionCerchasUc(idUnidadConstruccion, campo) {
        if (!campo) return;

        const valor = obtenerValorCampoEditableOpcion5(campo);

        if (!valor) {
            campo.textContent = '00';
        }

        actualizarTotalCalificacionCerchasUc(idUnidadConstruccion, campo);
    }

    function seleccionarEstructuraConvencionalUc(idUnidadConstruccion, campo, valor, texto) {
        const resultado = obtenerUnidadConstruccionOpcion5(idUnidadConstruccion);
        const hiddenInput = document.getElementById(`${campo}_${idUnidadConstruccion}`);
        const dropdown = document.getElementById(`dropdown_${campo}_${idUnidadConstruccion}`);
        const collapse = document.getElementById(`collapse_${campo}_${idUnidadConstruccion}`);

        if (hiddenInput) {
            hiddenInput.value = valor;
        }

        if (resultado?.unidad) {
            resultado.unidad[campo] = valor;
        }

        if (dropdown) {
            dropdown.innerHTML = `
            <span>${texto}</span>
            <i class="fa-solid fa-chevron-down icon-dropdown-arrow"></i>
        `;
        }

        if (collapse) {
            if (window.bootstrap?.Collapse) {
                bootstrap.Collapse.getOrCreateInstance(collapse, {
                    toggle: false
                }).hide();
            } else {
                collapse.classList.remove('show');
            }
        }

        prepararPayloadEdicionPredio();
    }

            role="tabpanel"
            aria-labelledby="tabDetalleCalificacionUc_${idUnidadConstruccion}">

    // funciones para las condicionales de los select de la quinta pestaña para los campo de caracteristicas de UC
    function obtenerOpcionesTipoCalificacionSegunClase(tipoClaseUc) {
        const tipo = (tipoClaseUc || '').trim().toLowerCase();

        if (!tipo) {
            return [];
        }

        if (tipo === 'anexo') {
            return [
                { valor: '', texto: 'Ninguna Selección' },
                { valor: 'No convencional', texto: 'No convencional' }
            ];
        }

        if (tipo === 'comercial') {
            return [
                { valor: '', texto: 'Ninguna Selección' },
                { valor: 'Convencional', texto: 'Convencional' },
                { valor: 'Tipología', texto: 'Tipología' }
            ];
        }

        if (tipo === 'industrial') {
            return [
                { valor: '', texto: 'Ninguna Selección' },
                { valor: 'Convencional', texto: 'Convencional' },
                { valor: 'Tipología', texto: 'Tipología' }
            ];
        }

        if (tipo === 'institucional') {
            return [
                { valor: '', texto: 'Ninguna Selección' },
                { valor: 'Convencional', texto: 'Convencional' },
                { valor: 'Tipología', texto: 'Tipología' }
            ];
        }

        if (tipo === 'residencial') {
            return [
                { valor: '', texto: 'Ninguna Selección' },
                { valor: 'Convencional', texto: 'Convencional' },
                { valor: 'Tipología', texto: 'Tipología' }
            ];
        }

        return [
            { valor: '', texto: 'Ninguna Selección' },
            { valor: 'Convencional', texto: 'Convencional' },
            { valor: 'No convencional', texto: 'No convencional' }
        ];
    }

    function crearOpcionesTipoCalificacionUc(unidad) {
        const opciones = obtenerOpcionesTipoCalificacionSegunClase(unidad.tipoClaseUc);

        return opciones.map(opcion => `

            <button class="dropdown-item" type="button"
                onclick="seleccionarTipoCalificacionUc(${unidad.idUnidadConstruccion}, '${escaparHtml(opcion.valor)}', '${escaparHtml(opcion.texto)}')">

    `).join('');
    }

    function crearOpcionesUsoUc(unidad) {
        const opciones = obtenerOpcionesUsoSegunClase(unidad.tipoClaseUc);

        return opciones.map(opcion => `
        <li>
            <button class="dropdown-item" type="button"
                onclick="seleccionarUsoUc(${unidad.idUnidadConstruccion}, '${escaparHtml(opcion.valor)}', '${escaparHtml(opcion.texto)}')">

    `).join('');
    }

    function refrescarOpcionesUsoUc(idUnidadConstruccion) {
        const resultado = obtenerUnidadConstruccionOpcion5(idUnidadConstruccion);
        if (!resultado) return;

        const { unidad } = resultado;
        const menu = document.getElementById(`menuUsoUc_${idUnidadConstruccion}`);
        const hiddenInput = document.getElementById(`uso_uc_${idUnidadConstruccion}`);
        const dropdown = document.getElementById(`dropdownUsoUc_${idUnidadConstruccion}`);

        if (!menu || !hiddenInput || !dropdown) return;

        const opciones = obtenerOpcionesUsoSegunClase(unidad.tipoClaseUc);
        const valoresValidos = opciones.map(item => item.valor);

        if (!valoresValidos.includes(unidad.usoUc || '')) {
            unidad.usoUc = '';
            hiddenInput.value = '';
            dropdown.innerHTML = `
            <span>Ninguna Selección</span>
            <i class="fa-solid fa-chevron-down icon-dropdown-arrow"></i>
        `;
        }

        menu.innerHTML = crearOpcionesUsoUc(unidad);
    }
