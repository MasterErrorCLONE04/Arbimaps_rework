<div class="card shadow-sm border-0" style="border-radius: 14px;">
  <div class="card-body p-4">
    <!-- Header -->
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 border-bottom pb-3 mb-4">
      <div>
        <h4 class="fw-bold mb-1" style="color: #032f57;">Notificaciones</h4>
        <p class="text-muted small mb-0">Gestiona y consulta los avisos de tu cuenta.</p>
      </div>
      <div class="d-flex align-items-center gap-2">
        <button id="btnMarkAllRead" class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-2" style="border-color: #032f57; color: #032f57;">
          <i class="bi bi-check2-all"></i>
          <span>Marcar todas como leídas</span>
        </button>
        <button id="btnRefresh" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-2" style="background-color: #032f57; border-color: #032f57;">
          <i class="bi bi-arrow-clockwise" id="refreshIcon"></i>
          <span>Actualizar</span>
        </button>
      </div>
    </div>

    <!-- Filters and Search -->
    <div class="row g-3 mb-4">
      <div class="col-md-7 d-flex gap-2 flex-wrap" id="filterGroup">
        <button class="btn btn-sm btn-light active-filter px-3" data-filter="all" style="border-radius: 20px;">Todas</button>
        <button class="btn btn-sm btn-light px-3" data-filter="unread" style="border-radius: 20px;">No leídas</button>
        <button class="btn btn-sm btn-light px-3" data-filter="read" style="border-radius: 20px;">Leídas</button>
        <button class="btn btn-sm btn-light px-3" data-filter="archived" style="border-radius: 20px;">
          <i class="bi bi-archive-fill me-1"></i>Archivadas
        </button>
      </div>
      <div class="col-md-5">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="notifSearch" class="form-control border-start-0" placeholder="Buscar por título o mensaje...">
        </div>
      </div>
    </div>

    <!-- Notifications List -->
    <div id="allNotificationsList" class="list-group list-group-flush" style="min-height: 200px;">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
        <div>Cargando notificaciones...</div>
      </div>
    </div>
  </div>
</div>

<style>
  .active-filter {
    background-color: #032f57 !important;
    color: #ffffff !important;
    font-weight: 500;
  }
  
  .notif-item {
    border: 1px solid #f1f5f9 !important;
    border-radius: 10px !important;
    margin-bottom: 8px;
    padding: 16px !important;
    transition: all 0.2s ease;
    background-color: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  
  .notif-item:hover {
    border-color: #dbeafe !important;
    background-color: #f8fafc !important;
    transform: translateY(-1px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }
  
  .notif-item.is-unread {
    background-color: #f0f7ff;
    border-left: 4px solid #032f57 !important;
  }
  
  .notif-item-body-link {
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    gap: 12px;
    flex-grow: 1;
    min-width: 0;
  }
  
  .notif-item-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background-color: #edf2f7;
    color: #4a5568;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
    transition: background-color 0.2s;
  }
  
  .notif-item.is-unread .notif-item-icon {
    background-color: #dbeafe;
    color: #032f57;
  }
  
  .notif-item-title {
    font-size: 14.5px;
    font-weight: 600;
    color: #1a202c;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  
  .notif-item-text {
    font-size: 13.5px;
    color: #4a5568;
    margin-bottom: 6px;
    word-break: break-word;
  }
  
  .notif-item-meta {
    font-size: 11.5px;
    color: #718096;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .notif-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  
  .btn-notif-action {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background-color: transparent;
    color: #718096;
    transition: all 0.2s;
  }
  
  .btn-notif-action:hover {
    background-color: #edf2f7;
    color: #2d3748;
  }
  
  .btn-notif-action.btn-mark-read:hover {
    background-color: #dbeafe;
    color: #032f57;
  }
  
  .btn-notif-action.btn-archive:hover {
    background-color: #fed7d7;
    color: #c53030;
  }

  .btn-notif-action.btn-restore:hover {
    background-color: #e0f2fe;
    color: #0369a1;
  }

  .notif-fade-out {
    opacity: 0;
    transform: scale(0.95);
    height: 0;
    padding: 0 !important;
    margin-bottom: 0 !important;
    border-width: 0 !important;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  .rotate-icon {
    animation: rotate 1s linear infinite;
  }
</style>

<script>
  (function () {
    let allNotifications = [];
    let currentFilter = 'all';
    let searchQuery = '';

    const listContainer = document.getElementById("allNotificationsList");
    const searchInput = document.getElementById("notifSearch");
    const filterButtons = document.querySelectorAll("#filterGroup button");
    const btnMarkAllRead = document.getElementById("btnMarkAllRead");
    const btnRefresh = document.getElementById("btnRefresh");
    const refreshIcon = document.getElementById("refreshIcon");

    const baseUrl = window.panelRp || window.rp || "";

    async function loadNotifications() {
      if (refreshIcon) refreshIcon.classList.add("rotate-icon");
      try {
        // Decide endpoint query based on archived view
        const isArchivedView = (currentFilter === 'archived');
        const response = await fetch(`${baseUrl}/notificaciones/mis-notificaciones?archivado=${isArchivedView}&limit=100`, {
          credentials: "same-origin"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        allNotifications = await response.json();
        renderList();
      } catch (error) {
        console.error("Error al cargar notificaciones:", error);
        listContainer.innerHTML = `
          <div class="text-center py-5 text-danger">
            <i class="bi bi-exclamation-octagon fs-2"></i>
            <div class="mt-2">No se pudieron cargar las notificaciones.</div>
          </div>
        `;
      } finally {
        if (refreshIcon) refreshIcon.classList.remove("rotate-icon");
        
        // Sync panel header bell count if function is present
        if (typeof window.loadNotifications === "function") {
          window.loadNotifications();
        }
      }
    }

    function renderList() {
      let filtered = allNotifications;

      // Filter locally for unread/read states (only applies to active view since database handles archived vs active)
      if (currentFilter === 'unread') {
        filtered = filtered.filter(item => item.leido === false);
      } else if (currentFilter === 'read') {
        filtered = filtered.filter(item => item.leido === true);
      }

      if (searchQuery.trim() !== '') {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(item => 
          (item.titulo || "").toLowerCase().includes(q) || 
          (item.mensaje || "").toLowerCase().includes(q)
        );
      }

      if (filtered.length === 0) {
        let msg = "No tienes notificaciones por el momento.";
        if (searchQuery.trim() !== '') msg = "No se encontraron notificaciones que coincidan con la búsqueda.";
        else if (currentFilter === 'unread') msg = "No tienes notificaciones sin leer.";
        else if (currentFilter === 'read') msg = "No tienes notificaciones leídas.";
        else if (currentFilter === 'archived') msg = "No tienes notificaciones archivadas.";

        listContainer.innerHTML = `
          <div class="text-center py-5 text-muted">
            <i class="bi bi-bell-slash text-opacity-25" style="color: #cbd5e1; font-size: 3rem !important; display: block; margin-bottom: 12px;"></i>
            <div class="fs-5 fw-semibold" style="color: #4a5568;">Bandeja vacía</div>
            <div class="small text-muted mt-1">${msg}</div>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = filtered.map(item => {
        const isUnread = item.leido === false;
        const title = escapeHtml(item.titulo || "Notificación");
        const message = escapeHtml(item.mensaje || "");
        const dateStr = formatNotificationDate(item.fecha_creacion);
        
        let iconClass = "bi-bell-fill";
        const typeStr = String(item.tipo || "").toLowerCase();
        if (typeStr.includes("error")) iconClass = "bi-exclamation-triangle-fill";
        else if (typeStr.includes("cierre")) iconClass = "bi-check2-circle";
        else if (typeStr.includes("workspace")) iconClass = "bi-diagram-3-fill";

        let actionButtonsHtml = '';
        if (currentFilter === 'archived') {
          // Actions for archived view: only Restore
          actionButtonsHtml = `
            <button type="button" class="btn-notif-action btn-restore" data-action="restore" data-id="${item.id}" title="Desarchivar (Restaurar)">
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>
          `;
        } else {
          // Actions for standard active view: Mark Read + Archive
          const readButton = isUnread ? `
            <button type="button" class="btn-notif-action btn-mark-read" data-action="read" data-id="${item.id}" title="Marcar como leída">
              <i class="bi bi-check2"></i>
            </button>
          ` : '';
          actionButtonsHtml = `
            ${readButton}
            <button type="button" class="btn-notif-action btn-archive" data-action="archive" data-id="${item.id}" title="Archivar">
              <i class="bi bi-archive"></i>
            </button>
          `;
        }

        const urlDest = item.url_destino ? escapeHtml(item.url_destino) : "";
        const bodyContent = `
          <div class="notif-item-icon">
            <i class="bi ${iconClass}"></i>
          </div>
          <div class="flex-grow-1 min-w-0">
            <div class="notif-item-title">${title}</div>
            <div class="notif-item-text">${message}</div>
            <div class="notif-item-meta">
              <span>${dateStr}</span>
              ${!isUnread ? '<span class="badge bg-light text-secondary border">Leído</span>' : '<span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="background-color: #e0f2fe !important; color: #0369a1 !important; border-color: #bae6fd !important;">Nuevo</span>'}
              ${item.archivado ? '<span class="badge bg-warning-subtle text-warning border border-warning-subtle" style="background-color: #fef3c7 !important; color: #d97706 !important; border-color: #fde68a !important;">Archivado</span>' : ''}
            </div>
          </div>
        `;

        return `
          <div class="notif-item ${isUnread ? 'is-unread' : ''}" id="notif-card-${item.id}" data-id="${item.id}">
            <div class="notif-item-body-link" data-url="${urlDest}" data-id="${item.id}" data-unread="${isUnread}">
              ${bodyContent}
            </div>
            <div class="notif-actions">
              ${actionButtonsHtml}
            </div>
          </div>
        `;
      }).join("");

      // Bind events
      listContainer.querySelectorAll(".notif-item-body-link").forEach(el => {
        el.addEventListener("click", async (e) => {
          const id = el.getAttribute("data-id");
          const url = el.getAttribute("data-url");
          const isUnread = el.getAttribute("data-unread") === "true";

          if (isUnread) {
            await markAsRead(id);
          }

          if (url) {
            const resolved = resolveNotificationUrl(url);
            if (resolved) window.location.href = resolved;
          } else {
            loadNotifications();
          }
        });
      });

      listContainer.querySelectorAll("[data-action='read']").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-id");
          await markAsRead(id);
          loadNotifications();
        });
      });

      listContainer.querySelectorAll("[data-action='archive']").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-id");
          await archiveNotification(id);
        });
      });

      listContainer.querySelectorAll("[data-action='restore']").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-id");
          await restoreNotification(id);
        });
      });
    }

    async function markAsRead(id) {
      try {
        await fetch(`${baseUrl}/notificaciones/${id}/leer`, {
          method: "POST",
          credentials: "same-origin"
        });
      } catch (error) {
        console.error("Error al marcar como leída:", error);
      }
    }

    async function archiveNotification(id) {
      const card = document.getElementById(`notif-card-${id}`);
      if (card) card.classList.add("notif-fade-out");
      
      try {
        const response = await fetch(`${baseUrl}/notificaciones/${id}/archivar`, {
          method: "POST",
          credentials: "same-origin"
        });
        if (!response.ok) throw new Error("API error");
        
        setTimeout(() => {
          allNotifications = allNotifications.filter(item => item.id != id);
          renderList();
        }, 300);
      } catch (error) {
        console.error("Error al archivar:", error);
        if (card) card.classList.remove("notif-fade-out");
        alert("No se pudo archivar la notificación.");
      }
    }

    async function restoreNotification(id) {
      const card = document.getElementById(`notif-card-${id}`);
      if (card) card.classList.add("notif-fade-out");
      
      try {
        const response = await fetch(`${baseUrl}/notificaciones/${id}/desarchivar`, {
          method: "POST",
          credentials: "same-origin"
        });
        if (!response.ok) throw new Error("API error");
        
        setTimeout(() => {
          allNotifications = allNotifications.filter(item => item.id != id);
          renderList();
        }, 300);
      } catch (error) {
        console.error("Error al desarchivar:", error);
        if (card) card.classList.remove("notif-fade-out");
        alert("No se pudo desarchivar la notificación.");
      }
    }

    async function markAllAsRead() {
      try {
        const response = await fetch(`${baseUrl}/notificaciones/leer-todas`, {
          method: "POST",
          credentials: "same-origin"
        });
        if (response.ok) {
          allNotifications.forEach(item => item.leido = true);
          renderList();
        }
      } catch (error) {
        console.error("Error al marcar todas como leídas:", error);
      }
    }

    function escapeHtml(val) {
      return String(val || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatNotificationDate(val) {
      if (!val) return "";
      const date = new Date(val);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("es-CO", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function resolveNotificationUrl(url) {
      const val = String(url || "").trim();
      if (!val) return "";
      if (/^(https?:)?\/\//i.test(val)) return val;
      if (baseUrl && val.startsWith(baseUrl)) return val;
      if (baseUrl) {
        return `${baseUrl}${val.startsWith("/") ? "" : "/"}${val}`;
      }
      return val.startsWith("/") ? val : `/${val}`;
    }

    // Listeners
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderList();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active-filter"));
        btn.classList.add("active-filter");
        
        const previousFilter = currentFilter;
        currentFilter = btn.getAttribute("data-filter");
        
        // Hide/show the "Mark all read" button if we are in archived view
        if (currentFilter === 'archived') {
          btnMarkAllRead.style.display = 'none';
        } else {
          btnMarkAllRead.style.display = 'inline-flex';
        }

        // If transitioning between archived view and active views, reload from server
        if (currentFilter === 'archived' || previousFilter === 'archived') {
          loadNotifications();
        } else {
          renderList();
        }
      });
    });

    btnMarkAllRead.addEventListener("click", markAllAsRead);
    btnRefresh.addEventListener("click", loadNotifications);

    // Initial load call
    loadNotifications();
  })();
</script>
